name: CI

on:
    pull_request:
        branches:
            - master

    push:
        branches:
            - master

permissions:
    contents: read

jobs:
    check:
        name: Astro QA
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check source, build, validate, lint and test
              run: npm run check
